name: Domain tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  domain-tests:
    name: Fast loop (Game.Domain + Game.Presentation.Pure)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run domain tests
        run: dotnet test dotnet/Game.Domain.Tests --nologo

      - name: Language ceiling (expects a CS8773 build failure)
        shell: bash
        run: |
          bash .github/scripts/probe-must-fail.sh \
            dotnet/LangVersionProbe \
            CS8773 \
            "Language ceiling holds: C# 9.0, matching Unity 6000.5.9f1." \
            "The fast loop now accepts C# newer than Unity 6000.5.9f1 does, so domain code can pass here and fail in the Editor."

      - name: NUnit API ceiling (expects a CS1503 build failure)
        shell: bash
        run: |
          bash .github/scripts/probe-must-fail.sh \
            dotnet/NUnitApiProbe \
            CS1503 \
            "NUnit API ceiling holds: 3.5, matching com.unity.ext.nunit in Unity 6000.5.9f1." \
            "Does.Not.Contain(<non-string>) is accepted by UnityNUnitVersion in dotnet/Directory.Build.props, so it is no longer the surface Unity 6000.5.9f1 ships and Game.Domain.Tests.Conformance is guarding nothing."
